document.getElementById("project-select").addEventListener("change", function () {
  currentProject = this.value;
  berlinExpanded = false; 
  localStorage.setItem("lastProject", currentProject); // ← 추가

  showImagesVertically(); // 슬라이드 대신 세로 나열
  updateProjectCredit(); // ✅ 추가

  const desc = projectDescriptions[currentProject];
  document.getElementById("desc-line1").textContent = desc.line1;
  document.getElementById("desc-line2").textContent = desc.line2;
  document.getElementById("desc-line3").textContent = desc.line3;
  document.getElementById("desc-line4").textContent = desc.line4 || "";
  document.getElementById("desc-line5").textContent = desc.line5 || "";
  document.getElementById("desc-line6").textContent = desc.line6 || "";

  const berlinToggle = document.getElementById("toggle-berlin");
  berlinToggle.style.display = currentProject === "puppet" ? "block" : "none";
});



window.addEventListener("DOMContentLoaded", () => {
  const projectSelect = document.getElementById("project-select");
  const toggleBerlin = document.getElementById("toggle-berlin");
  const toggleBerlinClose = document.getElementById("toggle-berlin-close");

  const savedProject = localStorage.getItem("lastProject");

  currentProject = savedProject && images[savedProject]
    ? savedProject
    : "puppet";

  projectSelect.value = currentProject;
  showImagesVertically();
  updateProjectCredit();

  const desc = projectDescriptions[currentProject];
  document.getElementById("desc-line1").textContent = desc.line1;
  document.getElementById("desc-line2").textContent = desc.line2;
  document.getElementById("desc-line3").textContent = desc.line3;

  /* ✅ OPEN */
  toggleBerlin.onclick = () => {
  if (berlinExpanded) return;

  berlinExpanded = true;
  toggleBerlin.style.display = "none";

  showImagesVertically();
  updateProjectCredit();

  toggleBerlinClose.style.display = "block";
  document.getElementById("berlin-credit").after(toggleBerlinClose);

  // ✅ 펼쳐진 첫 베를린 이미지로 자동 스크롤
  requestAnimationFrame(() => {
    const start = document.getElementById("berlin-start");
    if (!start) return;

    window.scrollTo({
      top: start.getBoundingClientRect().top + window.pageYOffset - 150,
      behavior: "smooth"
    });
  });
};

  /* ✅ CLOSE */
  toggleBerlinClose.onclick = () => {
    const berlinContainer = document.getElementById("berlin-container");

    [...berlinContainer.children].forEach(el => {
      el.classList.add("berlin-collapse");
    });

    setTimeout(() => {
      berlinExpanded = false;

      showImagesVertically();
      updateProjectCredit();

      toggleBerlinClose.style.display = "none";
      toggleBerlin.style.display = "block";
      toggleBerlin.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });
    }, 400);
  };
});







  function toggleMenu() {
  const modal = document.getElementById("modal-menu");
  const toggle = document.getElementById("menuToggle");

  const isOpen = modal.classList.contains("show");

  

  if (isOpen) {
    modal.classList.remove("show");
    toggle.classList.remove("rotate");

    // 강제로 트랜지션 제거
    modal.style.transition = "none";

    // opacity가 0이 되더라도 트랜지션 없이 바로 적용되게
    requestAnimationFrame(() => {
      modal.style.opacity = "0";
      modal.style.pointerEvents = "none";
    });

  } else {

     // 모달 열기: 트랜지션 추가 후 show 클래스 추가
    modal.style.transition = "opacity 0.7s ease";
    modal.style.opacity = "";
    modal.style.pointerEvents = "";

    modal.classList.add("show");
    toggle.classList.add("rotate");
  }
}



function createImageWrapper(src) {
  const wrapper = document.createElement("div");
  wrapper.className = "image-wrapper";

  const img = document.createElement("img");
  img.src = src;
  img.loading = "lazy";
  wrapper.appendChild(img);

  const filename = src.split("/").pop();
  const metaSource = document.querySelector(
    `.image-meta-pool [data-image="${filename}"]`
  );

  if (metaSource) {
    const meta = document.createElement("div");
    meta.className = "image-meta";
    meta.innerHTML = metaSource.innerHTML;
    wrapper.appendChild(meta);
  }

  return wrapper;
}


function showImagesVertically() {
  const container = document.getElementById("image-container");
  const berlinContainer = document.getElementById("berlin-container");

  container.innerHTML = "";
  berlinContainer.innerHTML = "";

  container.className = "vertical-images";
  berlinContainer.className = "vertical-images";

  // 🔹 Puppet / 기본 프로젝트 이미지
  images[currentProject].forEach(src => {
    container.appendChild(createImageWrapper(src));
  });

 if (currentProject === "puppet" && berlinExpanded) {

  // ✅ 베를린 전용 상단 여백 스페이서
  const spacer = document.createElement("div");
  spacer.style.height = "100px";   // ← 여기서 여백 조절
  spacer.style.width = "100%";
  berlinContainer.appendChild(spacer);

  images.puppetber.forEach((src, index) => {
    const wrapper = createImageWrapper(src);

    if (index === 0) {
      wrapper.id = "berlin-start"; // 🔑 스크롤 기준
    }

    berlinContainer.appendChild(wrapper);
  });
}
}



function updateProjectCredit() {
  const mainCredit = document.getElementById("project-credit");
  const berlinCredit = document.getElementById("berlin-credit");

  // 🟢 Puppet / 기본 프로젝트 크레딧 (항상 고정)
  const mainData = projectCredits[currentProject];
  mainCredit.innerHTML = mainData
    ? `${mainData.line1 || ""}<br>${mainData.line2 || ""}<br>${mainData.line3 || ""}`
    : "";

  // 🟢 Berlin 크레딧은 펼쳤을 때만
  if (currentProject === "puppet" && berlinExpanded) {
    const berlinData = projectCredits.puppetber;
    berlinCredit.innerHTML = `
      ${berlinData.line1 || ""}<br>
      ${berlinData.line2 || ""}<br>
      ${berlinData.line3 || ""}
    `;
    berlinCredit.style.display = "block";
  } else {
    berlinCredit.innerHTML = "";
    berlinCredit.style.display = "none";
  }
}
