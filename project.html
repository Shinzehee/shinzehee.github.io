  function toggleMenu() {
  const modal = document.getElementById("modal-menu");
  const toggle = document.getElementById("menuToggle");

  const isOpen = modal.classList.contains("show");

  

  if (isOpen) {
    modal.classList.remove("show");
    toggle.classList.remove("rotate");

    // 강제로 트랜지션 제거
    modal.style.transition = "none";

    // opacity가 0이 되더라도 트랜지션 없이 바로 적용되게
    requestAnimationFrame(() => {
      modal.style.opacity = "0";
      modal.style.pointerEvents = "none";
    });

  } else {

     // 모달 열기: 트랜지션 추가 후 show 클래스 추가
    modal.style.transition = "opacity 0.7s ease";
    modal.style.opacity = "";
    modal.style.pointerEvents = "";

    modal.classList.add("show");
    toggle.classList.add("rotate");
  }
}

function updateProjectCredit() {
  const creditBox = document.getElementById("project-credit");
  if (!creditBox) return;

  // Berlin 펼침 상태면 puppetber 크레딧 사용
  const key =
    currentProject === "puppet" && berlinExpanded
      ? "puppetber"
      : currentProject;

  const creditData = projectCredits[key];

  if (!creditData) {
    creditBox.innerHTML = "";
    return;
  }

  creditBox.innerHTML = `
    ${creditData.line1 || ""}<br>
    ${creditData.line2 || ""}<br>
    ${creditData.line3 || ""}
  `;
